title: Termimy
lang: pl
terms:
  - id: supports
    label: Obsługuje
    description: Funkcjonalność produktu posiada co najmniej jedną metodę, która spełnia kryterium bez znanych wad lub spełnia z równoważnym ułatwieniem.
  - id: "partially-supports"
    label: Częściowo obsługuje
    description: Niektóre funkcjonalności produktu nie spełniają tego kryterium.
  - id: "does-not-support"
    label: Nie obsługuje
    description: Większość funkcjonalności produktu nie spełnia tego kryterium.
  - id: "not-applicable"
    label: Nie dotyczy
    description: Kryterium to nie ma znaczenia dla produktu.
  - id: "not-evaluated"
    label: Nie oceniono
    description: Produkt nie został oceniony pod kątem tego kryterium. Może to być używane tylko w WCAG 2.x Poziom AAA.

